name: dispatcher-parity

# M0.6 — Reviewed seed dispatcher smoke gate; full SQL corpus is pending.
# Runs on EVERY PR.  For each (engine, dispatcher) combination in
#   {memtx, vinyl} x {generated, cnp, llvm}
# runs the SQL baseline harness and compares each JIT/CnP output
# against the generated-dispatcher output.
# Fails with JIT-CORRECTNESS-REGRESSION:<dispatcher> on any L1 or L2 divergence.
#
# This job does NOT compare against stored baseline snapshots;
# it only checks that all dispatchers agree with each other.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}-dispatcher-parity', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  dispatcher-parity:
    # Skip if the 'notest' label is present.
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.pull_request.labels.*.name, 'notest')

    runs-on: ubuntu-20.04-self-hosted

    timeout-minutes: 60

    container:
      image: docker.io/tarantool/testing:ubuntu-focal
      options: '--init --privileged'

    strategy:
      fail-fast: false
      matrix:
        engine: [memtx, vinyl]

    steps:
      - name: Prepare checkout
        uses: tarantool/actions/prepare-checkout@master

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set environment
        uses: ./.github/actions/environment

      - name: Install deps
        uses: ./.github/actions/install-deps-debian

      - name: Check native-dispatch build toolchains
        run: |
          cmake --version
          found_clang=false
          for compiler in clang-19 clang-20 clang-21 clang-22; do
            if command -v "$compiler" >/dev/null 2>&1; then
              "$compiler" --version
              found_clang=true
              break
            fi
          done
          if [ "$found_clang" != true ]; then
            echo 'CnP requires clang-19 or newer; the CI container does not provide it.'
            exit 1
          fi
          python3 --version

      # Build once; all dispatcher modes share the same binary.
      # The VDBE_DISPATCHER env var selects the dispatcher at runtime.
      - name: Build tarantool
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_SQL_JIT=ON \
            -DENABLE_SQL_CNP=ON \
            -DENABLE_BACKTRACE=ON
          cmake --build build --target tarantool -- -j$(nproc)

      - name: Run harness (generated dispatcher)
        run: |
          python3 test/sql-baselines/corpus.py capture \
            --repo=. --binary=build/src/tarantool \
            --out=/tmp/snap-${{ matrix.engine }}-generated \
            --engine=${{ matrix.engine }} --mode=generated

      - name: Run harness (cnp dispatcher)
        run: |
          python3 test/sql-baselines/corpus.py capture \
            --repo=. --binary=build/src/tarantool \
            --out=/tmp/snap-${{ matrix.engine }}-cnp \
            --engine=${{ matrix.engine }} --mode=cnp

      - name: Run harness (llvm dispatcher)
        run: |
          python3 test/sql-baselines/corpus.py capture \
            --repo=. --binary=build/src/tarantool \
            --out=/tmp/snap-${{ matrix.engine }}-llvm \
            --engine=${{ matrix.engine }} --mode=llvm

      - name: Check dispatcher manifest coverage equality
        run: |
          python3 test/sql-baselines/corpus.py compare-coverage \
            --repo=. --base=/tmp/snap-${{ matrix.engine }}-generated \
            --candidate=/tmp/snap-${{ matrix.engine }}-cnp \
            --engine=${{ matrix.engine }} --candidate-mode=cnp
          python3 test/sql-baselines/corpus.py compare-coverage \
            --repo=. --base=/tmp/snap-${{ matrix.engine }}-generated \
            --candidate=/tmp/snap-${{ matrix.engine }}-llvm \
            --engine=${{ matrix.engine }} --candidate-mode=llvm

      # Compare cnp vs generated (L1+L2 only — use --strict for soft gates too,
      # but only hard-gate failure fails the build).
      - name: Diff cnp vs generated (${{ matrix.engine }})
        id: diff-cnp
        run: |
          build/src/tarantool test/sql-baselines/diff.lua \
            /tmp/snap-${{ matrix.engine }}-generated/snapshots \
            /tmp/snap-${{ matrix.engine }}-cnp/snapshots \
            --ignore-path-class --format=json > /tmp/diff-${{ matrix.engine }}-cnp.json
          build/src/tarantool test/sql-baselines/diff.lua \
            /tmp/snap-${{ matrix.engine }}-generated/snapshots \
            /tmp/snap-${{ matrix.engine }}-cnp/snapshots \
            --ignore-path-class --format=text
        continue-on-error: true

      - name: Check cnp parity (${{ matrix.engine }})
        run: |
          if [ '${{ steps.diff-cnp.outcome }}' != 'success' ]; then
            echo "CnP snapshot diff command failed, possibly on malformed input."
            exit 1
          fi
          if ! python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["summary"]["passed"] is True else 1)' \
            /tmp/diff-${{ matrix.engine }}-cnp.json; then
            echo "JIT-CORRECTNESS-REGRESSION:cnp engine=${{ matrix.engine }}"
            echo "CnP dispatcher diverges from generated dispatcher."
            echo "See dispatcher-parity-artifacts for the full diff."
            exit 1
          fi

      # Compare llvm vs generated.
      - name: Diff llvm vs generated (${{ matrix.engine }})
        id: diff-llvm
        run: |
          build/src/tarantool test/sql-baselines/diff.lua \
            /tmp/snap-${{ matrix.engine }}-generated/snapshots \
            /tmp/snap-${{ matrix.engine }}-llvm/snapshots \
            --ignore-path-class --format=json > /tmp/diff-${{ matrix.engine }}-llvm.json
          build/src/tarantool test/sql-baselines/diff.lua \
            /tmp/snap-${{ matrix.engine }}-generated/snapshots \
            /tmp/snap-${{ matrix.engine }}-llvm/snapshots \
            --ignore-path-class --format=text
        continue-on-error: true

      - name: Check llvm parity (${{ matrix.engine }})
        run: |
          if [ '${{ steps.diff-llvm.outcome }}' != 'success' ]; then
            echo "LLVM snapshot diff command failed, possibly on malformed input."
            exit 1
          fi
          if ! python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["summary"]["passed"] is True else 1)' \
            /tmp/diff-${{ matrix.engine }}-llvm.json; then
            echo "JIT-CORRECTNESS-REGRESSION:llvm engine=${{ matrix.engine }}"
            echo "LLVM MCJIT dispatcher diverges from generated dispatcher."
            echo "See dispatcher-parity-artifacts for the full diff."
            exit 1
          fi

      - name: Upload parity diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-parity-${{ matrix.engine }}
          path: |
            /tmp/diff-${{ matrix.engine }}-cnp.json
            /tmp/diff-${{ matrix.engine }}-llvm.json
          retention-days: 14

      - name: Send VK Teams message on failure
        if: failure()
        uses: ./.github/actions/report-job-status
        with:
          bot-token: ${{ secrets.VKTEAMS_BOT_TOKEN }}
